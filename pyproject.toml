[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-workbench"
dynamic = ["version"]
description = "A configurable multi-repository workspace and Git observability service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Workspace Workbench contributors" }]
dependencies = []

[project.scripts]
workspace-workbench = "workspace_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
