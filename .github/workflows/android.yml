name: Android app
on:
  push:
    branches: ['**']
    paths: ['android-app/**', 'web-assets/**', 'scripts/release-android.mjs', '.github/workflows/android*.yml']
  pull_request:
    paths: ['android-app/**', 'web-assets/**', 'scripts/release-android.mjs', '.github/workflows/android*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node android-app/scripts/version.mjs --check
      - run: node --test android-app/scripts/test/*.test.mjs
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - run: npm --prefix web-assets ci --ignore-scripts
      - run: npm --prefix web-assets run bundle
      - run: npm --prefix web-assets test
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: android-app
      - run: python3 android-app/scripts/verify-apk.py android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: paseo-pocket-android-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
