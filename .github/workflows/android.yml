name: Android app
on:
  push:
    paths: ['android-app/**', 'web-assets/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android-app/**', 'web-assets/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm --prefix web-assets ci --ignore-scripts
      - run: npm --prefix web-assets run bundle
      - run: npm --prefix web-assets test
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: android-app
      - run: python3 android-app/scripts/verify-apk.py android-app/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: paseo-pocket-android-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
