<script>
(() => {
  const root = document.getElementById('pocket-tools-draft');
  const template = document.getElementById('pt-phone-content');
  const phones = [...root.querySelectorAll('.pt-phone')];
  const state = { logo: 'route', size: 36, appearance: 'system' };
  const names = { appearance: '外观', version: '网页版本', source: '更新来源', cache: '缓存与诊断' };
  const modes = { system: '跟随系统', light: '明亮', dark: '深色' };
  function saved(value) {
    if (!value || typeof value !== 'object') return;
    if (['route','pocket','portal'].includes(value.logo)) state.logo = value.logo;
    if (['system','light','dark'].includes(value.appearance)) state.appearance = value.appearance;
    if (Number.isFinite(value.size)) state.size = Math.max(30, Math.min(42, value.size));
  }
  function persist() {
    if (window.openai?.setWidgetState) Promise.resolve(window.openai.setWidgetState({ modelContent: { ...state }, privateContent: null })).catch(() => {});
  }
  function render() {
    for (const phone of phones) {
      phone.style.colorScheme = state.appearance === 'system' ? 'light dark' : state.appearance;
      phone.style.setProperty('--pt-size', state.size + 'px');
      phone.querySelectorAll('use[data-logo]').forEach(use => use.setAttribute('href', '#pt-' + state.logo));
      phone.querySelector('[data-theme-label]').textContent = modes[state.appearance];
    }
  }
  function icons() { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 20, height: 20 } }); }
  function show(phone, open) {
    phone.dataset.open = String(open);
    phone.querySelector('.pt-overlay').hidden = !open;
    phone.querySelector('.pt-float').setAttribute('aria-expanded', String(open));
    if (!open) detail(phone, null);
  }
  function detail(phone, page) {
    const area = phone.querySelector('.pt-detail');
    phone.querySelector('.pt-actions').hidden = Boolean(page);
    area.hidden = !page;
    phone.querySelector('.pt-menu-brand strong').textContent = names[page] || '工具';
    if (!page) { area.replaceChildren(); return; }
    const uid = phone.dataset.kind;
    const content = {
      appearance: `<div>${Object.entries(modes).map(([value,label]) => `<label class="pt-choice cursor-interaction"><input type="radio" name="${uid}-appearance" value="${value}" ${value===state.appearance?'checked':''}><span>${label}</span></label>`).join('')}</div>`,
      version: '<strong>当前网页 0.12.0</strong><p>更新由你手动检查。应用前可以继续使用当前页面。</p><button type="button" class="pt-detail-button cursor-interaction" data-primary data-local="check">检查页面更新</button><span class="pt-detail-note" aria-live="polite"></span>',
      source: `<label class="pt-choice cursor-interaction"><input type="radio" name="${uid}-source" value="official" checked><span>官方</span></label><label class="pt-choice cursor-interaction"><input type="radio" name="${uid}-source" value="custom"><span>自定义</span></label><input class="pt-detail-field" aria-label="自定义更新来源" placeholder="https://updates.example/paseo/" hidden><button type="button" class="pt-detail-button cursor-interaction" data-primary data-local="save-source">保存</button><span class="pt-detail-note" aria-live="polite"></span>`,
      cache: '<button type="button" class="pt-detail-button cursor-interaction" data-local="clear">清理临时资源缓存</button><p>保留主机配对、已安装页面与网页本地数据。</p><button type="button" class="pt-detail-button cursor-interaction" data-local="diagnostic">诊断与网页引擎</button><span class="pt-detail-note" aria-live="polite"></span>'
    };
    area.innerHTML = content[page];
    const back = document.createElement('button');
    back.type = 'button'; back.className = 'pt-detail-button cursor-interaction'; back.textContent = '返回工具';
    back.addEventListener('click', () => detail(phone, null)); area.append(back);
    area.addEventListener('change', event => {
      const target = event.target;
      if (target.name === uid + '-appearance') { state.appearance = target.value; render(); persist(); }
      if (target.name === uid + '-source') area.querySelector('.pt-detail-field').hidden = target.value !== 'custom';
    }, { signal: phone.detailAbort.signal });
    icons();
  }
  saved(window.openai?.widgetState?.modelContent);
  for (const phone of phones) {
    phone.append(template.content.cloneNode(true));
    phone.detailAbort = new AbortController();
    const button = phone.querySelector('.pt-float');
    let pointer = null, suppressClick = false;
    button.addEventListener('pointerdown', event => {
      suppressClick = false;
      const parent = phone.getBoundingClientRect(), box = button.getBoundingClientRect();
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY, left: box.left-parent.left, top: box.top-parent.top, moved: false };
      button.setPointerCapture(event.pointerId);
    });
    button.addEventListener('pointermove', event => {
      if (!pointer || event.pointerId !== pointer.id) return;
      const dx=event.clientX-pointer.x, dy=event.clientY-pointer.y;
      if (Math.hypot(dx,dy)>6) pointer.moved=true;
      if (!pointer.moved) return;
      button.style.right='auto';
      button.style.left=Math.max(0,Math.min(phone.clientWidth-button.offsetWidth,pointer.left+dx))+'px';
      const y=Math.max(104,Math.min(phone.clientHeight-170,pointer.top+dy));
      button.style.top=y+'px';phone.style.setProperty('--pt-card-y',Math.max(50,Math.min(250,y-232))+'px');
    });
    button.addEventListener('pointerup', () => {
      if (!pointer) return;
      suppressClick=pointer.moved;
      if (pointer.moved) {
        const left=button.offsetLeft+button.offsetWidth/2<phone.clientWidth/2;
        phone.dataset.dock=left?'left':'right';
        button.style.left=left?(phone.dataset.kind==='edge'?'0px':'4px'):'auto';button.style.right=left?'auto':(phone.dataset.kind==='edge'?'0px':'6px');
        if (phone.dataset.kind==='card') { const menu=phone.querySelector('.pt-menu');menu.style.left=left?'62px':'auto';menu.style.right=left?'auto':'62px'; }
      }
      pointer=null;
    });
    button.addEventListener('pointercancel', () => { pointer=null;suppressClick=true; });
    button.addEventListener('click', () => { if(suppressClick){suppressClick=false;return;}show(phone,phone.dataset.open!=='true'); });
    phone.querySelector('.pt-close').addEventListener('click', () => show(phone,false));
    phone.querySelector('.pt-scrim').addEventListener('click', () => show(phone,false));
    phone.addEventListener('keydown', event => { if(event.key==='Escape')show(phone,false); });
    phone.querySelectorAll('[data-action]').forEach(control => control.addEventListener('click', () => {
      phone.detailAbort.abort();phone.detailAbort=new AbortController();detail(phone,control.dataset.action);
    }));
    phone.querySelector('.pt-detail').addEventListener('click', event => {
      const action=event.target.closest('[data-local]')?.dataset.local;
      const area=phone.querySelector('.pt-detail'),note=area.querySelector('.pt-detail-note');
      if(action==='check')note.textContent='当前页面已是最新版本（示例）';
      if(action==='clear')note.textContent='示例缓存已清理，配对与草稿保留';
      if(action==='diagnostic')note.textContent='系统 WebView · 诊断不包含会话内容';
      if(action==='save-source') {
        const custom=area.querySelector('input[value="custom"]').checked;
        if(custom&&!/^https:\/\/[^\s]+$/.test(area.querySelector('.pt-detail-field').value)){note.textContent='请输入 HTTPS 更新地址';return;}
        phone.querySelector('[data-source-label]').textContent=custom?'自定义':'官方';detail(phone,null);
      }
    });
    show(phone,true);
  }
  render();
  window.addEventListener('openai:set_globals', event => { saved(event.detail?.globals?.widgetState?.modelContent);render(); });
  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});
    tweak.addSelect(state,'logo',{label:'Logo 方向',options:[{label:'路径',value:'route'},{label:'口袋',value:'pocket'},{label:'叠窗',value:'portal'}]});
    tweak.addSlider(state,'size',{label:'方钮视觉尺寸',min:30,max:42,step:2,unit:'px'});
  }
})();
</script>
