name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string
      promote_stable:
        description: Promote this tag to stable after a successful build
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: workspace-workbench-release
  cancel-in-progress: false

jobs:
  backend:
    name: Build backend (${{ matrix.key }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: darwin-arm64
            runner: macos-14
          - key: darwin-x64
            runner: macos-15-intel
          - key: linux-x64
            runner: ubuntu-latest
          - key: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend builder
        run: python -m pip install pyinstaller
      - name: Build backend worker
        run: python scripts/build_backend.py --output-dir "paseo-plugin/backend/${{ matrix.key }}"
      - name: Upload backend worker
        uses: actions/upload-artifact@v4
        with:
          name: workspace-backend-${{ matrix.key }}
          path: paseo-plugin/backend/${{ matrix.key }}/workspace-workbench
          if-no-files-found: error
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: backend
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release version and tag
        run: python scripts/version.py --check --tag "$RELEASE_TAG"
      - name: Install Python build tooling
        run: python -m pip install build
      - name: Build Python distributions
        run: python -m build --outdir dist
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-plugin/package-lock.json
      - name: Install plugin dependencies
        run: npm ci
        working-directory: paseo-plugin
      - name: Download backend workers
        uses: actions/download-artifact@v4
        with:
          pattern: workspace-backend-*
          path: ${{ runner.temp }}/workspace-backends
          merge-multiple: false
      - name: Install backend workers into plugin archive
        shell: bash
        run: |
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/workspace-backends/workspace-backend-*; do
            key="${artifact#*workspace-backend-}"
            mkdir -p "paseo-plugin/backend/$key"
            cp "$artifact/workspace-workbench" "paseo-plugin/backend/$key/workspace-workbench"
            chmod 755 "paseo-plugin/backend/$key/workspace-workbench"
          done
      - name: Verify plugin
        run: |
          npm run typecheck
          npm test
        working-directory: paseo-plugin
      - name: Package Paseo plugin
        run: python scripts/package_plugin.py --output-dir dist
      - name: Add backend worker release attachments
        shell: bash
        run: |
          version="$(<VERSION)"
          shopt -s nullglob
          for artifact in "$RUNNER_TEMP"/workspace-backends/workspace-backend-*; do
            key="${artifact#*workspace-backend-}"
            cp "$artifact/workspace-workbench" "dist/workspace-workbench-backend-$key-$version"
          done
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Promote released commit to stable
        if: github.event_name == 'push' || inputs.promote_stable == true
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse 'HEAD^{commit}')"
          if git ls-remote --exit-code origin refs/heads/stable >/dev/null 2>&1; then
            git fetch --no-tags origin stable
            stable_sha="$(git rev-parse 'refs/remotes/origin/stable^{commit}')"
            if ! git merge-base --is-ancestor "$stable_sha" "$release_sha"; then
              echo "::error title=Stable promotion blocked::stable ($stable_sha) is not an ancestor of the release commit ($release_sha); refusing to overwrite stable"
              exit 1
            fi
            echo "stable can be fast-forwarded from $stable_sha to $release_sha"
          else
            echo "stable does not exist; it will be created at $release_sha"
          fi
          git push origin "$release_sha:refs/heads/stable"
          actual_sha="$(git ls-remote origin refs/heads/stable | awk 'NR == 1 { print $1 }')"
          if [[ "$actual_sha" != "$release_sha" ]]; then
            echo "::error title=Stable promotion verification failed::expected stable at $release_sha, found $actual_sha"
            exit 1
          fi
          echo "stable now points to $release_sha"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --verify-tag --generate-notes
          fi
