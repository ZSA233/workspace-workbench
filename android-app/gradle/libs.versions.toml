[versions]
agp = "9.4.0"
appcompat = "1.8.0"
activity = "1.13.0"
core = "1.18.0"
material = "1.14.0"
webkit = "1.17.1"
compress = "1.28.0"
junit = "4.13.2"
test-runner = "1.7.0"
test-junit = "1.3.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
activity = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
core = { module = "androidx.core:core-ktx", version.ref = "core" }
material = { module = "com.google.android.material:material", version.ref = "material" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
compress = { module = "org.apache.commons:commons-compress", version.ref = "compress" }
junit = { module = "junit:junit", version.ref = "junit" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
