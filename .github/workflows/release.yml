name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release version and tag
        run: python scripts/version.py --check --tag "$RELEASE_TAG"
      - name: Install Python build tooling
        run: python -m pip install build
      - name: Build Python distributions
        run: python -m build --outdir dist
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paseo-plugin/package-lock.json
      - name: Install plugin dependencies
        run: npm ci
        working-directory: paseo-plugin
      - name: Verify plugin
        run: |
          npm run typecheck
          npm test
        working-directory: paseo-plugin
      - name: Package Paseo plugin
        run: python scripts/package_plugin.py --output-dir dist
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --verify-tag --generate-notes
          fi
      - name: Promote released commit to stable
        run: git push origin HEAD:refs/heads/stable
